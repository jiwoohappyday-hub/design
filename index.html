<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디자인 역사 : 시대·사조·트렌드·기법 인과 구조도</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0b0c;--bg2:#131315;--bg3:#1a1a1e;--bg4:#222226;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#dedad2;--muted:#5e5c57;--muted2:#35342f;
  --c1:#c8a96e;--c2:#c8816e;--c3:#a96ec8;
  --c4:#6e9ec8;--c5:#c86e8a;--c6:#6ec8a9;--c7:#c8b86e;--c8:#6e7ec8;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-weight:300;display:flex;flex-direction:column;}

/* TOP */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--border);flex-shrink:0;z-index:50;background:rgba(11,11,12,0.85);backdrop-filter:blur(20px);}
.top-title{font-size:16px;font-weight:500;letter-spacing:-0.02em;}
.top-sub{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.meta-criteria{display:flex;gap:16px;align-items:center;background:var(--bg2);border:1px solid var(--border);padding:6px 14px;border-radius:6px;}
.meta-label{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:.05em;}
.meta-item{font-size:10px;color:var(--text);display:flex;align-items:center;gap:4px;}
.meta-item span{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}

/* CANVAS */
.canvas{flex:1;overflow:auto;display:flex;}
.grid{display:flex;align-items:flex-start;min-height:100%;padding-top:20px;}
.era-section{flex-shrink:0;display:flex;height:100%;border-right:1px solid var(--border);}

/* ERA INFO */
.era-info-col{width:260px;flex-shrink:0;padding:24px;background:rgba(11,11,12,0.4);backdrop-filter:blur(10px);position:sticky;left:0;z-index:10;border-right:1px solid var(--border);display:flex;flex-direction:column;}
.era-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:4px}
.era-name{font-size:18px;font-weight:500;line-height:1.2;margin-bottom:6px}
.era-period{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:16px}
.era-bg{font-size:9px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
.era-bg-pill{padding:3px 10px;border-radius:2px;border:1px solid var(--border);background:var(--bg2);white-space:nowrap;}
.era-next-box{padding:16px;font-size:10px;color:var(--muted);border:1px solid var(--border);background:var(--bg2);border-radius:8px;line-height:1.6;display:flex;gap:12px;align-items:flex-start;margin-top:auto;}
.era-next-arrow{flex-shrink:0;font-size:14px}

/* MOVEMENTS */
.movements-row{display:flex;align-items:flex-start;gap:16px;padding:40px 32px 80px 32px;min-height:100%;}

/* CARD */
.mov{flex-shrink:0;width:300px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg2);display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;}
.mov:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.4);}
.mov.active{border-color:rgba(255,255,255,0.22);box-shadow:0 0 0 1px rgba(255,255,255,0.08),0 8px 32px rgba(0,0,0,.5);}
.mov.upcoming{background:transparent;border-color:rgba(255,255,255,0.03);cursor:default;}
.mov.upcoming:hover{border-color:rgba(255,255,255,0.05);transform:none;box-shadow:none;}
.mov .tree-section{overflow-y:auto;padding-bottom:18px;}

.mov-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;}
.mov-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.mov-info{flex:1;min-width:0;}
.mov-name{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:4px;word-break:keep-all;}
.mov-art-tag{display:inline-block;font-size:8px;padding:1px 5px;border-radius:2px;background:rgba(200,110,138,.12);color:#c86e8a;margin-bottom:5px;}
.mov-cases{font-size:9px;color:var(--muted);line-height:1.6}
.mov-cases b{color:var(--text);font-weight:400}
.mov-modern{margin-top:8px;font-size:9px;padding:6px 10px;border-radius:4px;border:1px solid;line-height:1.4;}

/* CLICK HINT */
.mov-hint{font-size:8px;color:var(--muted);text-align:center;padding:5px 0 8px;letter-spacing:.08em;opacity:.6;}

/* TREE */
.tree-section{padding:10px 14px 12px 14px;}
.tree-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.tree-label::before{content:'';display:block;width:14px;height:1px;background:var(--muted2);}
.trend-row{display:flex;align-items:flex-start;padding:2px 0;}
.trend-line{width:18px;flex-shrink:0;position:relative;align-self:stretch;}
.trend-line::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--muted2);}
.trend-row:last-child .trend-line::before,.trend-row:last-child .trend-line::after{display:none;}
.trend-line::after{content:'';position:absolute;left:7px;top:10px;width:8px;height:1px;background:var(--muted2);}
.trend-body{flex:1;padding-bottom:4px}
.trend-name{font-size:10px;color:var(--text);padding:2px 0;line-height:1.4;}
.tech-rows{padding-left:14px;margin-top:2px;}
.tech-row{display:flex;align-items:flex-start;gap:0;padding:1px 0;}
.tech-line{width:16px;flex-shrink:0;position:relative;align-self:stretch;}
.tech-line::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--muted2);opacity:.5;}
.tech-row:last-child .tech-line::before{height:8px;bottom:auto;}
.tech-line::after{content:'';position:absolute;left:6px;top:8px;width:7px;height:1px;background:var(--muted2);opacity:.5;}
.tech-name{font-size:9px;color:var(--muted);padding:1px 0;line-height:1.4;}

/* ══ OVERLAY ══ */
.overlay{position:fixed;inset:0;z-index:80;background:transparent;pointer-events:none;transition:background .25s;}
.overlay.open{background:rgba(0,0,0,0.55);pointer-events:all;}

/* ══ SIDE PANEL ══ */
.panel{
  position:fixed;top:0;right:0;width:480px;height:100vh;
  background:var(--bg3);border-left:1px solid var(--border2);
  z-index:90;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.panel.open{transform:translateX(0);}

/* Panel Header */
.panel-header{
  padding:20px 52px 16px 24px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.panel-close{
  position:absolute;top:16px;right:16px;
  width:30px;height:30px;border-radius:50%;
  border:1px solid var(--border2);background:var(--bg2);
  color:var(--muted);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.panel-close:hover{background:var(--bg4);color:var(--text);}
.panel-era-badge{
  font-size:8px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
  font-family:'DM Mono',monospace;
}
.panel-title{font-size:20px;font-weight:500;line-height:1.2;margin-bottom:6px;}
.panel-art{display:inline-block;font-size:9px;padding:2px 7px;border-radius:3px;background:rgba(200,110,138,.12);color:#c86e8a;margin-bottom:8px;}
.panel-meta{font-size:10px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
.panel-meta b{color:var(--text);font-weight:400;}
.panel-modern{font-size:10px;padding:8px 12px;border-radius:5px;border:1px solid;line-height:1.5;}

/* Panel Body */
.panel-body{flex:1;overflow-y:auto;padding:20px 24px 40px;}

/* Section */
.ps{margin-bottom:28px;}
.ps-title{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.ps-title-icon{font-size:12px;}

/* IMAGE PREVIEW GRID */
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.img-item{
  border-radius:6px;overflow:hidden;
  border:1px solid var(--border);
  cursor:pointer;transition:border-color .15s,transform .15s;
  background:var(--bg2);
  text-decoration:none;
  display:block;
}
.img-item:hover{border-color:var(--border2);transform:scale(1.02);}
.img-preview{
  min-height:118px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
  padding:14px 12px;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,0.05), transparent 28%),
    linear-gradient(135deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
}
.img-preview-kicker{
  font-size:8px;
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-family:'DM Mono',monospace;
}
.img-preview-title{
  font-size:12px;
  color:var(--text);
  line-height:1.45;
  word-break:keep-all;
}
.img-preview-action{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}
.img-item-label{font-size:9px;color:var(--muted);padding:6px 8px;line-height:1.4;border-top:1px solid var(--border);}
.img-notice{font-size:9px;color:var(--muted);margin-top:6px;line-height:1.5;font-style:italic;}

/* LINK BUTTONS */
.link-list{display:flex;flex-direction:column;gap:8px;}
.link-btn{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg2);
  text-decoration:none;color:var(--text);
  transition:all .15s;cursor:pointer;
}
.link-btn:hover{border-color:var(--border2);background:var(--bg4);}
.link-icon{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;
}
.link-info{flex:1;min-width:0;}
.link-name{font-size:11px;font-weight:500;margin-bottom:2px;}
.link-desc{font-size:9px;color:var(--muted);}
.link-arrow{font-size:12px;color:var(--muted);}

/* WORK LIST */
.work-list{display:flex;flex-direction:column;gap:6px;}
.work-item{
  padding:8px 12px;border-radius:5px;
  border:1px solid var(--border);background:var(--bg2);
  font-size:10px;color:var(--text);line-height:1.5;
}
.work-link{
  display:block;
  text-decoration:none;
  color:var(--text);
  transition:all .15s;
  position:relative;
  padding-right:18px;
}
.work-link:hover{
  border-color:var(--border2);
  background:var(--bg4);
  transform:translateX(2px);
}
.work-link::after{
  content:'↗';
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  font-size:10px;
}
.work-kicker{
  display:block;
  font-size:8px;
  color:var(--muted);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:3px;
  font-family:'DM Mono',monospace;
}
.work-title{
  display:block;
  font-size:10px;
  color:var(--text);
  line-height:1.45;
  word-break:keep-all;
}
.work-brand .work-title{
  color:inherit;
}


/* WORK DETAIL */
.work-detail{
  margin-top:10px;
  padding:14px;
  border-radius:8px;
  border:1px solid var(--border2);
  background:rgba(255,255,255,0.025);
}
.work-detail-kicker{
  font-family:'DM Mono',monospace;
  font-size:8px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:6px;
}
.work-detail-title{
  font-size:14px;
  font-weight:500;
  color:var(--text);
  margin-bottom:8px;
  line-height:1.45;
}
.work-detail-text{
  font-size:10px;
  color:var(--muted);
  line-height:1.7;
  word-break:keep-all;
}
.work-detail-links{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px;
}
.work-detail-link{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--bg2);
  text-decoration:none;
  color:var(--text);
  font-size:10px;
}
.work-detail-link:hover{
  border-color:var(--border2);
  background:var(--bg4);
}
.work-detail-link span{
  color:var(--muted);
  font-size:9px;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* BG */
.bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;background:radial-gradient(circle at 20% 30%,rgba(200,169,110,.03),transparent 40%),radial-gradient(circle at 80% 70%,rgba(110,158,200,.03),transparent 40%);}
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- TOP BAR -->
<div class="top">
  <div>
    <div class="top-title">디자인 역사 : 시대·사조·트렌드·기법 인과 구조도</div>
    <div class="top-sub">The Design Atlas — 거시적 인과 관계와 미시적 조형 기법의 시스템 맵핑</div>
  </div>
  <div class="meta-criteria">
    <div class="meta-label">대표 사례 선정 기준</div>
    <div class="meta-item"><span>①</span> 시대 영향력</div>
    <div class="meta-item"><span>②</span> 디자인 전환점</div>
    <div class="meta-item"><span>③</span> 현대 연결성</div>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas">
<div class="grid" id="grid"></div>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>

<!-- SIDE PANEL -->
<div class="panel" id="panel">
  <div class="panel-header" id="panelHeader">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-era-badge" id="panelEra"></div>
    <div class="panel-title" id="panelTitle"></div>
    <div id="panelArtTag"></div>
    <div class="panel-meta" id="panelMeta"></div>
    <div class="panel-modern" id="panelModern"></div>
  </div>
  <div class="panel-body">

    <!-- 대표 이미지 -->
    <div class="ps">
      <div class="ps-title"><span class="ps-title-icon">🖼</span> 대표 이미지 자료 — 클릭하면 관련 이미지 검색으로 이동</div>
      <div class="img-grid" id="panelImgs"></div>
      <div class="img-notice">* 외부 이미지 API가 차단되어도 깨지지 않도록, 대표 이미지는 검색 프리뷰 카드로 표시돼요. 클릭하면 Google 이미지/검색 자료로 이동합니다.</div>
    </div>

    <!-- 외부 링크 -->
    <div class="ps">
      <div class="ps-title"><span class="ps-title-icon">🔗</span> 더 알아보기 — 클릭하면 새 탭으로 이동</div>
      <div class="link-list" id="panelLinks"></div>
    </div>

    <!-- 대표 작품 목록 -->
    <div class="ps">
      <div class="ps-title"><span class="ps-title-icon">📋</span> 대표 작품 · 브랜드 — 누르면 작품 소개가 열림</div>
      <div class="work-list" id="panelWorks"></div>
      <div id="workDetail"></div>
    </div>

  </div>
</div>

<script>

      {name:"개념미술 영향",person:"요셉 보이스 · 솔 르윗 · 로렌스 와이너",work:"사회적 조각 · 월 드로잉 시리즈",modern:"개념 중심 브랜딩 · 미니멀 카피라이팅",art:true,color:"#c86e8a",
       links:{wiki:"https://ko.wikipedia.org/wiki/개념_미술",googleArt:"https://artsandculture.google.com/search?q=conceptual+art",youtube:"https://www.youtube.com/results?search_query=conceptual+art+history+sol+lewitt"},
       imgs:[{label:"솔 르윗 월 드로잉",q:"sol lewitt wall drawing conceptual"},{label:"요셉 보이스",q:"joseph beuys social sculpture"}],
       trends:[{name:"개념 중심 브랜딩",techs:["디지털 타이포그래피","브랜딩 시스템"]},{name:"미니멀 카피라이팅",techs:["브랜딩 시스템"]}]},
    ]
  },
];

// ── BUILD DOM ──────────────────────────────────────────
const grid = document.getElementById('grid');

ERAS.forEach(era => {
  const section = document.createElement('div');
  section.className = 'era-section';

  // Info sidebar
  const info = document.createElement('div');
  info.className = 'era-info-col';
  info.style.color = era.color;
  info.innerHTML = `
    <div class="era-num">${era.num}</div>
    <div class="era-name">${era.name}</div>
    <div class="era-period">${era.period}</div>
    <div class="era-bg">${era.bg.map(b=>`<span class="era-bg-pill">${b}</span>`).join('')}</div>
    <div class="era-next-box" style="border-left:3px solid ${era.color}">
      <span class="era-next-arrow">↓</span>
      <span>${era.next}</span>
    </div>
  `;
  section.appendChild(info);

  // Movements row
  const row = document.createElement('div');
  row.className = 'movements-row';

  era.movements.forEach(mov => {
    const card = document.createElement('div');
    card.className = 'mov';

    // Header
    const mhead = document.createElement('div');
    mhead.className = 'mov-head';
    let casesHtml = '';
    if (mov.person) casesHtml += `<b>${mov.person}</b><br>`;
    if (mov.work)   casesHtml += `<span style="color:var(--muted)">${mov.work}</span><br>`;
    if (mov.brand)  casesHtml += `<span style="color:var(--muted)">${mov.brand}</span>`;
    mhead.innerHTML = `
      <div class="mov-dot" style="background:${mov.color}"></div>
      <div class="mov-info">
        ${mov.art ? '<span class="mov-art-tag">미술→디자인</span>' : ''}
        <div class="mov-name" style="color:${mov.color}">${mov.name}</div>
        <div class="mov-cases">${casesHtml}</div>
        <div class="mov-modern" style="color:${mov.color};border-color:${mov.color}44">↗ ${mov.modern}</div>
      </div>
    `;
    card.appendChild(mhead);

    // Click hint
    const hint = document.createElement('div');
    hint.className = 'mov-hint';
    hint.textContent = '클릭하면 이미지 & 링크 →';
    card.appendChild(hint);

    // Tree
    const tree = document.createElement('div');
    tree.className = 'tree-section';
    const tlbl = document.createElement('div');
    tlbl.className = 'tree-label';
    tlbl.textContent = '해당 트렌드 → 해당 기법';
    tree.appendChild(tlbl);

    mov.trends.forEach((tr, ti) => {
      const isLast = ti === mov.trends.length - 1;
      const trow = document.createElement('div');
      trow.className = 'trend-row';
      const tline = document.createElement('div');
      tline.className = 'trend-line';
      if (isLast) {
        tline.innerHTML = `
          <span style="position:absolute;left:7px;top:0;height:10px;width:1px;background:var(--muted2);display:block"></span>
          <span style="position:absolute;left:7px;top:10px;width:8px;height:1px;background:var(--muted2);display:block"></span>
        `;
      }
      const tbody = document.createElement('div');
      tbody.className = 'trend-body';
      const tname = document.createElement('div');
      tname.className = 'trend-name';
      tname.textContent = tr.name;
      tbody.appendChild(tname);
      if (tr.techs && tr.techs.length) {
        const techRows = document.createElement('div');
        techRows.className = 'tech-rows';
        tr.techs.forEach(tech => {
          const techRow = document.createElement('div');
          techRow.className = 'tech-row';
          const techLine = document.createElement('div');
          techLine.className = 'tech-line';
          const techName = document.createElement('div');
          techName.className = 'tech-name';
          techName.textContent = tech;
          techRow.appendChild(techLine);
          techRow.appendChild(techName);
          techRows.appendChild(techRow);
        });
        tbody.appendChild(techRows);
      }
      trow.appendChild(tline);
      trow.appendChild(tbody);
      tree.appendChild(trow);
    });
    card.appendChild(tree);

    // Click → open panel
    card.addEventListener('click', () => openPanel(mov, era));
    row.appendChild(card);
  });

  section.appendChild(row);
  grid.appendChild(section);
});

function openExternal(url) {
  const opened = window.open(url, '_blank', 'noopener,noreferrer');
  if (!opened) {
    window.location.href = url;
  }
}


function cleanQueryText(text) {
  return String(text || '')
    .replace(/["“”]/g, '')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/→/g, ' ')
    .replace(/·/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function buildSearchUrl(label, movName, type) {
  const base = cleanQueryText(label + ' ' + movName);
  if (type === 'wiki') {
    return `https://ko.wikipedia.org/w/index.php?search=${encodeURIComponent(base)}`;
  }
  if (type === 'images') {
    return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(base)}`;
  }
  return `https://www.google.com/search?q=${encodeURIComponent(base + ' 작품 소개 디자인 역사')}`;
}

function renderWorkDetail(label, mov, type) {
  const box = document.getElementById('workDetail');
  if (!box) return;

  const isBrand = type === 'brand';
  const searchMain = buildSearchUrl(label, mov.name, 'main');
  const searchImages = buildSearchUrl(label, mov.name, 'images');
  const searchWiki = buildSearchUrl(label, mov.name, 'wiki');

  box.innerHTML = `
    <div class="work-detail" style="border-left:3px solid ${mov.color}">
      <div class="work-detail-kicker">${isBrand ? '대표 브랜드 소개' : '대표 작품 소개'}</div>
      <div class="work-detail-title">${label}</div>
      <div class="work-detail-text">
        이 항목은 <b style="color:var(--text);font-weight:400">${mov.name}</b>을 설명하는 대표 사례야.
        이 사조의 핵심 흐름은 <b style="color:var(--text);font-weight:400">${mov.modern || '현대 디자인 흐름'}</b>로 이어져.
        아래 버튼에서 이미지, 작품 설명, 관련 자료를 바로 확인할 수 있어.
      </div>
      <div class="work-detail-links">
        <a class="work-detail-link" href="${searchImages}" target="_blank" rel="noopener noreferrer">이미지 보기 <span>Google Images ↗</span></a>
        <a class="work-detail-link" href="${searchWiki}" target="_blank" rel="noopener noreferrer">작품/인물 설명 보기 <span>Wikipedia 검색 ↗</span></a>
        <a class="work-detail-link" href="${searchMain}" target="_blank" rel="noopener noreferrer">관련 자료 더 보기 <span>Google 검색 ↗</span></a>
      </div>
    </div>
  `;
}

// ── PANEL ──────────────────────────────────────────────
let activeCard = null;

function openPanel(mov, era) {
  // Active card highlight
  document.querySelectorAll('.mov.active').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');

  // Header
  document.getElementById('panelEra').textContent = `${era.num}  ${era.name}`;
  document.getElementById('panelEra').style.color = era.color;
  document.getElementById('panelTitle').textContent = mov.name;
  document.getElementById('panelTitle').style.color = mov.color;

  const artTag = document.getElementById('panelArtTag');
  artTag.innerHTML = mov.art ? '<span class="panel-art">미술→디자인 영향</span>' : '';

  let metaHtml = '';
  if (mov.person) metaHtml += `<b>${mov.person}</b><br>`;
  if (mov.work)   metaHtml += mov.work + '<br>';
  if (mov.brand)  metaHtml += mov.brand;
  document.getElementById('panelMeta').innerHTML = metaHtml;

  const mod = document.getElementById('panelModern');
  mod.textContent = '↗ ' + mov.modern;
  mod.style.color = mov.color;
  mod.style.borderColor = mov.color + '44';

  // Images
  const imgGrid = document.getElementById('panelImgs');
  imgGrid.innerHTML = '';
  (mov.imgs || []).forEach(img => {
    const url = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent((img.q || img.label) + ' ' + mov.name)}`;
    const a = document.createElement('a');
    a.className = 'img-item';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      openExternal(url);
    });
    a.innerHTML = `
      <div class="img-preview" style="border-left:3px solid ${mov.color}">
        <div class="img-preview-kicker">대표 이미지 검색</div>
        <div class="img-preview-title">${img.label}</div>
        <div class="img-preview-action">이미지 검색에서 보기 ↗</div>
      </div>
      <div class="img-item-label">${img.label} · 관련 이미지 자료로 이동 ↗</div>
    `;
    imgGrid.appendChild(a);
  });

  // Links
  const linkList = document.getElementById('panelLinks');
  linkList.innerHTML = '';
  const links = mov.links || {};

  const linkDefs = [
    { key:'googleArt', icon:'🎨', bg:'#1a1f2e', color:'#6e9ec8', name:'구글 아트 & 컬처', desc:'고화질 이미지 · 작품 상세 감상' },
    { key:'wiki',      icon:'📖', bg:'#1e1e1e', color:'#dedad2', name:'위키피디아',        desc:'역사적 배경 · 인물 정보 · 영향' },
    { key:'youtube',   icon:'▶',  bg:'#1f1515', color:'#c86e6e', name:'유튜브 강의 검색',  desc:'관련 다큐 · 아트 해설 · 강의' },
  ];

  linkDefs.forEach(def => {
    if (!links[def.key]) return;
    const a = document.createElement('a');
    a.className = 'link-btn';
    a.href = links[def.key];
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      openExternal(links[def.key]);
    });
    a.innerHTML = `
      <div class="link-icon" style="background:${def.bg};color:${def.color}">${def.icon}</div>
      <div class="link-info">
        <div class="link-name">${def.name}</div>
        <div class="link-desc">${def.desc}</div>
      </div>
      <div class="link-arrow">↗</div>
    `;
    linkList.appendChild(a);
  });

  // Works & Brands — click item first shows an in-site intro, then provides stable links
  const workList = document.getElementById('panelWorks');
  const workDetail = document.getElementById('workDetail');
  workList.innerHTML = '';
  if (workDetail) workDetail.innerHTML = '';

  const makeLinkedItem = (label, kicker, type='work') => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = type === 'brand' ? 'work-item work-link work-brand' : 'work-item work-link';
    btn.style.textAlign = 'left';
    btn.style.width = '100%';
    btn.style.cursor = 'pointer';
    btn.style.fontFamily = 'inherit';
    btn.style.color = type === 'brand' ? mov.color : 'var(--text)';
    btn.innerHTML = `
      <span class="work-kicker">${kicker}</span>
      <span class="work-title">${label}</span>
    `;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      renderWorkDetail(label, mov, type);
    });
    workList.appendChild(btn);
  };

  if (mov.work) {
    mov.work.split(' · ').map(w => w.trim()).filter(Boolean).forEach(w => {
      makeLinkedItem(w, '대표 작품 · 누르면 소개 열림', 'work');
    });
  }

  if (mov.brand) {
    mov.brand.split(' · ').map(b => b.trim()).filter(Boolean).forEach(b => {
      makeLinkedItem(b, '대표 브랜드 · 누르면 소개 열림', 'brand');
    });
  }

  if (!mov.work && !mov.brand) {
    const div = document.createElement('div');
    div.className = 'work-item';
    div.textContent = '대표 작품·브랜드 정보가 아직 없습니다.';
    workList.appendChild(div);
  }

  // Open
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.querySelectorAll('.mov.active').forEach(c => c.classList.remove('active'));
}
</script>
</body>
</html>
