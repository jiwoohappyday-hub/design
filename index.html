<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #0b0b0c;
  --bg2: #131315;
  --bg3: #1a1a1e;
  --bg4: #202025;

  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);

  --text: #dedad2;
  --text2: #b8b3aa;
  --muted: #7a766d;
  --muted2: #3a3935;

  --gold: #c8a96e;
  --red: #c8816e;
  --violet: #a96ec8;
  --blue: #6e9ec8;
  --pink: #c86e8a;
  --mint: #6ec8a9;
  --olive: #c8b86e;
  --indigo: #6e7ec8;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans KR", sans-serif;
  font-weight: 300;
  display: flex;
  flex-direction: column;
}

.bg-glow {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(200,169,110,0.055), transparent 35%),
    radial-gradient(circle at 80% 70%, rgba(110,158,200,0.05), transparent 35%),
    linear-gradient(180deg, rgba(255,255,255,0.015), transparent 40%);
}

/* TOP */
.top {
  height: 72px;
  flex-shrink: 0;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(11,11,12,0.86);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 50;
}

.top-title {
  font-family: "DM Serif Display", serif;
  font-size: 22px;
  letter-spacing: -0.02em;
}

.top-sub {
  margin-top: 3px;
  font-family: "DM Mono", monospace;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.top-right {
  text-align: right;
  font-family: "DM Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.6;
}

/* CANVAS */
.canvas {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
}

.grid {
  min-height: 100%;
  display: flex;
  align-items: stretch;
  padding: 18px 0 0;
}

/* COLUMN */
.era-col {
  width: 380px;
  min-width: 380px;
  max-width: 420px;
  height: calc(100vh - 72px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.era-col.future {
  opacity: 0.72;
  background: repeating-linear-gradient(
    -45deg,
    rgba(255,255,255,0.015),
    rgba(255,255,255,0.015) 8px,
    rgba(255,255,255,0.005) 8px,
    rgba(255,255,255,0.005) 16px
  );
}

/* HEADER */
.era-head {
  position: sticky;
  top: 0;
  z-index: 5;
  padding: 20px 20px 18px;
  background: rgba(11,11,12,0.96);
  border-bottom: 3px solid;
}

.era-num {
  font-family: "DM Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
}

.era-name {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.25;
  word-break: keep-all;
}

.era-period {
  margin-top: 5px;
  font-family: "DM Mono", monospace;
  font-size: 10px;
  color: var(--muted);
}

/* BACKGROUND PILLS */
.bg-set {
  margin-top: 12px;
  display: grid;
  gap: 5px;
}

.bg-row {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.bg-key {
  width: 38px;
  flex-shrink: 0;
  font-size: 8px;
  color: var(--muted);
  font-family: "DM Mono", monospace;
  letter-spacing: 0.08em;
}

.bg-pill {
  display: inline-block;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg2);
  font-size: 9px;
  color: var(--text2);
  line-height: 1.35;
  word-break: keep-all;
}

/* WHY CHANGE NEXT */
.flow-box {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  display: grid;
  gap: 7px;
}

.flow-item {
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 8px;
  align-items: start;
  font-size: 10px;
  line-height: 1.55;
}

.flow-label {
  font-family: "DM Mono", monospace;
  color: var(--muted);
  font-size: 8px;
  letter-spacing: 0.1em;
}

.flow-text {
  color: var(--text2);
}

/* CONTENT SCROLL */
.movements-container {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px 80px;
}

.movements {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* CARD */
.mov {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: rgba(19,19,21,0.92);
  transition: border-color 0.18s, transform 0.18s, background 0.18s;
}

.mov:hover {
  border-color: var(--border2);
  background: rgba(26,26,30,0.95);
  transform: translateY(-1px);
}

.mov-head {
  padding: 13px 14px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.mov-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 6px;
}

.mov-info {
  flex: 1;
  min-width: 0;
}

.mov-topline {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 5px;
}

.mov-name {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.35;
  word-break: keep-all;
}

.tag {
  display: inline-flex;
  align-items: center;
  height: 16px;
  padding: 0 6px;
  border-radius: 999px;
  font-family: "DM Mono", monospace;
  font-size: 8px;
  letter-spacing: 0.04em;
}

.tag-art {
  color: var(--pink);
  background: rgba(200,110,138,0.12);
  border: 1px solid rgba(200,110,138,0.26);
}

.tag-select {
  color: var(--gold);
  background: rgba(200,169,110,0.10);
  border: 1px solid rgba(200,169,110,0.24);
}

/* CASE GRID */
.case-grid {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.case-row {
  display: grid;
  grid-template-columns: 62px 1fr;
  gap: 8px;
  align-items: start;
  font-size: 9.5px;
  line-height: 1.55;
}

.case-label {
  color: var(--muted);
  font-family: "DM Mono", monospace;
  font-size: 8px;
  letter-spacing: 0.08em;
}

.case-value {
  color: var(--text2);
  word-break: keep-all;
}

/* MODERN */
.modern {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid;
  font-size: 9.5px;
  line-height: 1.55;
}

.modern-chain {
  display: grid;
  gap: 2px;
}

.chain-arrow {
  color: var(--muted);
  font-family: "DM Mono", monospace;
}

/* TREE */
.tree-section {
  padding: 11px 14px 14px;
}

.tree-label {
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: "DM Mono", monospace;
  font-size: 8px;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.tree-label::before {
  content: "";
  display: block;
  width: 16px;
  height: 1px;
  background: var(--muted2);
}

.trend-row {
  display: flex;
  align-items: flex-start;
  padding: 2px 0;
}

.trend-line {
  width: 18px;
  flex-shrink: 0;
  position: relative;
  align-self: stretch;
}

.trend-line::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--muted2);
}

.trend-line::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 10px;
  width: 8px;
  height: 1px;
  background: var(--muted2);
}

.trend-row:last-child .trend-line::before {
  height: 10px;
  bottom: auto;
}

.trend-body {
  flex: 1;
  padding-bottom: 5px;
}

.trend-name {
  font-size: 10px;
  color: var(--text);
  line-height: 1.45;
}

.tech-rows {
  padding-left: 14px;
  margin-top: 3px;
}

.tech-row {
  display: flex;
  align-items: flex-start;
  padding: 1px 0;
}

.tech-line {
  width: 16px;
  flex-shrink: 0;
  position: relative;
  align-self: stretch;
}

.tech-line::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--muted2);
  opacity: 0.5;
}

.tech-line::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 8px;
  width: 7px;
  height: 1px;
  background: var(--muted2);
  opacity: 0.5;
}

.tech-row:last-child .tech-line::before {
  height: 8px;
  bottom: auto;
}

.tech-name {
  font-size: 9px;
  color: var(--muted);
  line-height: 1.45;
}

/* FUTURE */

  padding: 16px 18px 80px;
  overflow-y: auto;
}

.future-title {
  font-family: "DM Mono", monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.14em;
  margin-bottom: 14px;
}

.future-list {
  display: grid;
  gap: 10px;
}

.future-item {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  background: rgba(19,19,21,0.55);
}

.future-item strong {
  display: block;
  font-size: 12px;
  margin-bottom: 4px;
}

.future-item span {
  font-family: "DM Mono", monospace;
  color: var(--muted);
  font-size: 9px;
}

.reserved {
  margin-top: 18px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.reserved h4 {
  font-size: 10px;
  color: var(--muted);
  font-family: "DM Mono", monospace;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.reserved-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.reserved-tags span {
  font-size: 9px;
  color: var(--text2);
  border: 1px solid var(--border);
  background: var(--bg2);
  padding: 4px 8px;
  border-radius: 999px;
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.02);
}

::-webkit-scrollbar-thumb {
  background: var(--border2);
  border-radius: 99px;
}

/* SMALL */
@media (max-width: 768px) {
  .era-col {
    width: 330px;
    min-width: 330px;
  }

  .top {
    padding: 12px 16px;
  }

  .top-title {
    font-size: 18px;
  }

  .top-right {
    display: none;
  }
}
</style>
</head>

const grid = document.getElementById("grid");

function makeCaseRow(label, value) {
  if (!value) return "";
  return `
    <div class="case-row">
      <div class="case-label">${label}</div>
      <div class="case-value">${value}</div>
    </div>
  `;
}

function makeModern(mov) {
  if (mov.modernChain && mov.modernChain.length) {
    return `
      <div class="modern" style="color:${mov.color};border-color:${mov.color}44">
        <div class="modern-chain">
          ${mov.modernChain.map((item, i) => `
            <div>${i === 0 ? "↗ " : ""}${item}</div>
            ${i < mov.modernChain.length - 1 ? '<div class="chain-arrow">↓</div>' : ""}
          `).join("")}
        </div>
      </div>
    `;
  }

  if (mov.modern) {
    return `
      <div class="modern" style="color:${mov.color};border-color:${mov.color}44">
        ↗ ${mov.modern}
      </div>
    `;
  }

  return "";
}

function renderFuture(col, era) {
  const panel = document.createElement("div");
  panel.className = "future-panel";

  panel.innerHTML = `
    <div class="future-title">RESERVED DESIGN FLOWS</div>

    <div class="future-list">
      ${era.futurePeriods.map(item => `
        <div class="future-item">
          <strong style="color:${era.color}">${item.title}</strong>
          <span>${item.period}</span>
        </div>
      `).join("")}
    </div>

    <div class="reserved">
      <h4>예약 디자인 흐름</h4>
      <div class="reserved-tags">
        ${era.reserved.map(item => `<span>${item}</span>`).join("")}
      </div>
    </div>
  `;

  col.appendChild(panel);
}

function renderEra(era) {
  const col = document.createElement("section");
  col.className = era.future ? "era-col future" : "era-col";

  const head = document.createElement("div");
  head.className = "era-head";
  head.style.borderColor = era.color;

  head.innerHTML = `
    <div class="era-num">${era.num}</div>
    <div class="era-name" style="color:${era.color}">${era.name}</div>
    <div class="era-period">${era.period}</div>
    ${
      era.bg
      ? `
        <div class="bg-set">
          <div class="bg-row"><span class="bg-key">TECH</span><span class="bg-pill">${era.bg.tech}</span></div>
          <div class="bg-row"><span class="bg-key">SOC</span><span class="bg-pill">${era.bg.society}</span></div>
          <div class="bg-row"><span class="bg-key">IDEA</span><span class="bg-pill">${era.bg.thought}</span></div>
        </div>
      `
      : ""
    }
  `;

  col.appendChild(head);

  if (era.future) {
    renderFuture(col, era);
    return col;
  }

  const flow = document.createElement("div");
  flow.className = "flow-box";
  flow.innerHTML = `
    <div class="flow-item">
      <div class="flow-label">WHY</div>
      <div class="flow-text">${era.flow.why}</div>
    </div>
    <div class="flow-item">
      <div class="flow-label">CHANGE</div>
      <div class="flow-text">${era.flow.change}</div>
    </div>
    <div class="flow-item">
      <div class="flow-label">NEXT</div>
      <div class="flow-text">${era.flow.next}</div>
    </div>
  `;
  col.appendChild(flow);

  const movCont = document.createElement("div");
  movCont.className = "movements-container";

  const movs = document.createElement("div");
  movs.className = "movements";

  era.movements.forEach(mov => {
    const card = document.createElement("article");
    card.className = "mov";

    const mhead = document.createElement("div");
    mhead.className = "mov-head";

    mhead.innerHTML = `
      <div class="mov-dot" style="background:${mov.color}"></div>
      <div class="mov-info">
        <div class="mov-topline">
          <div class="mov-name" style="color:${mov.color}">${mov.name}</div>
          ${mov.art ? '<span class="tag tag-art">INFLUENCE</span>' : ""}
          ${mov.optional ? '<span class="tag tag-select">SELECT</span>' : ""}
        </div>

        <div class="case-grid">
          ${makeCaseRow("PERSON", mov.person)}
          ${makeCaseRow("WORK", mov.work)}
          ${makeCaseRow("BRAND", mov.brand)}
        </div>

        ${makeModern(mov)}
      </div>
    `;

    card.appendChild(mhead);

    const tree = document.createElement("div");
    tree.className = "tree-section";

    const label = document.createElement("div");
    label.className = "tree-label";
    label.textContent = "TREND → TECHNIQUE";
    tree.appendChild(label);

    mov.trends.forEach(tr => {
      const row = document.createElement("div");
      row.className = "trend-row";

      const line = document.createElement("div");
      line.className = "trend-line";

      const body = document.createElement("div");
      body.className = "trend-body";

      const name = document.createElement("div");
      name.className = "trend-name";
      name.textContent = tr.name;
      body.appendChild(name);

      if (tr.techs && tr.techs.length) {
        const techRows = document.createElement("div");
        techRows.className = "tech-rows";

        tr.techs.forEach(tech => {
          const techRow = document.createElement("div");
          techRow.className = "tech-row";

          const techLine = document.createElement("div");
          techLine.className = "tech-line";

          const techName = document.createElement("div");
          techName.className = "tech-name";
          techName.textContent = tech;

          techRow.appendChild(techLine);
          techRow.appendChild(techName);
          techRows.appendChild(techRow);
        });

        body.appendChild(techRows);
      }

      row.appendChild(line);
      row.appendChild(body);
      tree.appendChild(row);
    });

    card.appendChild(tree);
    movs.appendChild(card);
  });

  movCont.appendChild(movs);
  col.appendChild(movCont);

  return col;
}

ERAS.forEach(era => {
  grid.appendChild(renderEra(era));
});
</script>
